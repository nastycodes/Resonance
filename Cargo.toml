
[package]
name = "resonance"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
cpal = "0.15"
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c6634f040af2e6b8fca9f3781c1e63222ef18753" }
# Local copy applies the small API adaptations required by the pinned GPUI-CE revision.
sqlly-textbox = { path = "vendor/sqlly-textbox" }
ring = "0.17"
base64 = "0.22"
async-trait = "0.1"
rodio = { version = "0.20.1", default-features = false, features = ["flac", "mp3", "vorbis", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
socket2 = "0.6"
libp2p = { version = "=0.56.0", default-features = false, features = ["autonat", "cbor", "dcutr", "ed25519", "identify", "macros", "noise", "quic", "relay", "request-response", "tcp", "tls", "tokio", "yamux"] }
openmls = { version = "=0.7.1", default-features = false, features = ["openmls_rust_crypto"] }
openmls_basic_credential = "=0.4.0"
openmls_memory_storage = "=0.4.1"
openmls_rust_crypto = "=0.4.1"
openmls_traits = "=0.4.1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
opus = "=0.4.0"
rtc = { version = "=0.21.1", default-features = false }
webrtc = { version = "=0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curve25519-dalek = "4"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
unicode-segmentation = "1.13"

[build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c6634f040af2e6b8fca9f3781c1e63222ef18753" }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Workaround: https://github.com/Lokathor/tinyvec/issues/225
[dependencies.tinyvec]
version = "=1.12.0"

[patch.crates-io]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c6634f040af2e6b8fca9f3781c1e63222ef18753" }
